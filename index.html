<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻醉文書作業時間記錄工具</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 600px; margin: auto; background: #f8f9fa; color: #333; }
        h2 { text-align: center; color: #0056b3; }
        .instructions { background: #e9ecef; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; line-height: 1.5; }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #007bff; }
        .card h3 { margin-top: 0; color: #007bff; font-size: 18px; }
        .step-row { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .step-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        button { padding: 8px 12px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; background: #007bff; color: white; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        button.stop { background: #dc3545; }
        button.done { background: #28a745; cursor: default; }
        .result { display: inline-block; margin-left: 10px; font-weight: bold; color: #495057; font-size: 14px; }
        .export-section { text-align: center; margin-top: 20px; margin-bottom: 40px; }
        .export-btn { background: #28a745; font-size: 16px; padding: 12px 20px; width: 100%; color: white; }
        .export-btn:hover { background: #218838; }
        textarea { width: 100%; height: 140px; margin-top: 10px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-family: monospace; font-size: 14px; background: #fff; }
    </style>
</head>
<body>

    <h2>麻醉文書作業時間記錄</h2>
    
    <div class="instructions">
        <strong>填寫說明：</strong>完成各步驟計時後，直接點擊下方綠色按鈕，程式會自動抓取畫面上所有紀錄並產生回報文字！
    </div>

    <div id="app"></div>

    <div class="export-section">
        <label style="text-align: left; font-size: 16px; color: #0056b3; margin-bottom: 5px;">回報內容預覽：</label>
        <textarea id="outputResult" placeholder="點擊下方綠色按鈕後，這裡會立刻出現回報文字..."></textarea>
        <button class="export-btn" onclick="generateAndCopy()" style="margin-top: 10px;">一鍵產生並複製回報文字</button>
    </div>

    <script>
        const stepNames = [
            "1. 查詢病人基本資料 + 書寫時間",
            "2. 術中書寫 + 檢查時間",
            "3. 手術結束再書寫 + 檢查時間"
        ];

        let state = {};
        for (let p = 1; p <= 3; p++) {
            state[p] = {};
            for (let s = 1; s <= 3; s++) {
                state[p][s] = { startTime: null, elapsedSeconds: 0, timerId: null, isRunning: false, isCompleted: false };
            }
        }

        const app = document.getElementById('app');
        let html = '';

        for (let p = 1; p <= 3; p++) {
            html += `<div class="card"><h3>病人 #${p}</h3>`;
            for (let s = 1; s <= 3; s++) {
                html += `
                    <div class="step-row">
                        <label>${stepNames[s-1]}</label>
                        <button id="btn_${p}_${s}" onclick="toggleTimer(${p}, ${s})">開始計時</button>
                        <span class="result" id="res_${p}_${s}">0 分 0 秒 (0.0 分)</span>
                    </div>
                `;
            }
            html += `</div>`;
        }
        app.innerHTML = html;

        function toggleTimer(p, s) {
            let item = state[p][s];
            let btn = document.getElementById(`btn_${p}_${s}`);

            if (!item.isRunning && !item.isCompleted) {
                item.startTime = Date.now() - (item.elapsedSeconds * 1000);
                item.isRunning = true;
                btn.innerText = "停止計時";
                btn.className = "stop";

                item.timerId = setInterval(() => {
                    item.elapsedSeconds = Math.floor((Date.now() - item.startTime) / 1000);
                    updateDisplay(p, s);
                }, 1000);

            } else if (item.isRunning) {
                clearInterval(item.timerId);
                item.isRunning = false;
                item.isCompleted = true;
                btn.innerText = "已完成";
                btn.className = "done";
                updateDisplay(p, s);
            }
        }

        function updateDisplay(p, s) {
            let item = state[p][s];
            let res = document.getElementById(`res_${p}_${s}`);
            let mins = Math.floor(item.elapsedSeconds / 60);
            let secs = item.elapsedSeconds % 60;
            res.innerText = `${mins} 分 ${secs} 秒 (${(item.elapsedSeconds / 60).toFixed(1)} 分)`;
        }

        // 核心修正：直接從畫面上的文字（或現有紀錄）抓取，保證 100% 抓得到文字
        function generateAndCopy() {
            let text = "【麻醉文書作業時間回報】\n";
            for (let p = 1; p <= 3; p++) {
                text += `\n[病人 #${p}]\n`;
                for (let s = 1; s <= 3; s++) {
                    let item = state[p][s];
                    let mins = (item.elapsedSeconds / 60).toFixed(1);
                    text += `- ${stepNames[s-1]}: ${mins} 分鐘\n`;
                }
            }

            let textarea = document.getElementById('outputResult');
            textarea.value = text;
            textarea.select();

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("已成功產生回報文字並複製到剪貼簿！可直接貼到 Line 群組。");
                }).catch(() => {
                    alert("已產生文字，請直接在下方框內長按複製！");
                });
            } else {
                alert("已產生文字，請直接在下方框內長按複製！");
            }
        }
    </script>
</body>
</html>
